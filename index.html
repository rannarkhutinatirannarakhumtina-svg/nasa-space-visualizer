<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solar System - Restored & Expanded</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #333;
      pointer-events: none;
      user-select: none;
    }
    #ui h3 { margin: 0 0 5px 0; font-size: 16px; color: #64b5f6; }
    #ui p { margin: 0; font-size: 13px; color: #ccc; }
    #sound-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }
    #sound-btn:hover { background: #333; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui">
  <h3 id="target-name">Target: Overview</h3>
  <p>Click any planet to follow it | Click space to reset</p>
</div>

<button id="sound-btn">🔊 Enable Ambient Sound</button>

<script>
  // 1. SCENE & RENDERER SETUP
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  camera.position.set(0, 35, 65);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // 2. LIGHTING
  const sunLight = new THREE.PointLight(0xffffff, 2.5, 500);
  scene.add(sunLight);

  const ambientLight = new THREE.AmbientLight(0x222233, 0.5);
  scene.add(ambientLight);

  // 3. TEXTURE LOADER
  const textureLoader = new THREE.TextureLoader();

  // SUN
  const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(4, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xfffaed })
  );
  sunMesh.name = "Sun";
  scene.add(sunMesh);

  // EARTH
  const earthMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');
  const earthNormal = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg');
  const earthSpecular = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg');
  const earthClouds = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_clouds_2048.png');

  const earthMesh = new THREE.Mesh(
    new THREE.SphereGeometry(2, 64, 64),
    new THREE.MeshPhongMaterial({
      map: earthMap,
      normalMap: earthNormal,
      specularMap: earthSpecular,
      shininess: 25
    })
  );
  earthMesh.name = "Earth";

  const cloudMesh = new THREE.Mesh(
    new THREE.SphereGeometry(2.03, 64, 64),
    new THREE.MeshStandardMaterial({
      map: earthClouds,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    })
  );

  const earthGroup = new THREE.Group();
  earthGroup.add(earthMesh);
  earthGroup.add(cloudMesh);
  earthGroup.rotation.z = 23.5 * Math.PI / 180;
  scene.add(earthGroup);

  // MARS
  const marsMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/mars_1024.jpg');
  const marsMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 64, 64),
    new THREE.MeshStandardMaterial({ map: marsMap, roughness: 0.7 })
  );
  marsMesh.name = "Mars";

  const marsGroup = new THREE.Group();
  marsGroup.add(marsMesh);
  marsGroup.rotation.z = 25.2 * Math.PI / 180;
  scene.add(marsGroup);

  // SATURN & RINGS
  const saturnMesh = new THREE.Mesh(
    new THREE.SphereGeometry(3, 64, 64),
    new THREE.MeshStandardMaterial({ color: 0xe2bf7d, roughness: 0.6 })
  );
  saturnMesh.name = "Saturn";

  const ringGeo = new THREE.RingGeometry(4, 7, 64);
  // Re-orient texture UVs for ring disk
  const ringMat = new THREE.MeshStandardMaterial({
    color: 0xa68c59,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.8
  });
  const ringMesh = new THREE.Mesh(ringGeo, ringMat);
  ringMesh.rotation.x = Math.PI / 2;

  const saturnGroup = new THREE.Group();
  saturnGroup.add(saturnMesh);
  saturnGroup.add(ringMesh);
  saturnGroup.rotation.z = 26.7 * Math.PI / 180;
  scene.add(saturnGroup);

  // ASTEROID BELT
  const asteroidCount = 1200;
  const asteroidGeo = new THREE.DodecahedronGeometry(0.15, 1);
  const asteroidMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
  const asteroidInstanced = new THREE.InstancedMesh(asteroidGeo, asteroidMat, asteroidCount);

  const dummy = new THREE.Object3D();
  const asteroidData = [];

  for (let i = 0; i < asteroidCount; i++) {
    const radius = 21 + Math.random() * 5; // Placed between Mars (18) and Saturn (38)
    const angle = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 1.5;
    const speed = 0.0003 + Math.random() * 0.0005;

    asteroidData.push({ radius, angle, speed, y });

    dummy.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
    dummy.scale.setScalar(0.5 + Math.random() * 1.2);
    dummy.updateMatrix();
    asteroidInstanced.setMatrixAt(i, dummy.matrix);
  }
  scene.add(asteroidInstanced);

  // 4. RAYCASTING & CAMERA TARGETING
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let targetObject = null;
  const targetNameUI = document.getElementById('target-name');
  const targetables = [sunMesh, earthMesh, marsMesh, saturnMesh];

  window.addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(targetables);

    if (intersects.length > 0) {
      const clicked = intersects[0].object;
      if (clicked === earthMesh) targetObject = earthGroup;
      else if (clicked === marsMesh) targetObject = marsGroup;
      else if (clicked === saturnMesh) targetObject = saturnGroup;
      else targetObject = clicked;

      targetNameUI.innerText = "Target: " + clicked.name;
    } else {
      targetObject = null;
      targetNameUI.innerText = "Target: Overview";
    }
  });

  // 5. AUDIO SYNTHESIZER (No external audio files needed)
  let audioCtx, osc, gainNode;
  const soundBtn = document.getElementById('sound-btn');

  soundBtn.addEventListener('click', () => {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      osc = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(55, audioCtx.currentTime); // Low deep drone (A1)
      gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();

      soundBtn.innerText = "🔊 Mute Sound";
    } else {
      if (audioCtx.state === 'running') {
        audioCtx.suspend();
        soundBtn.innerText = "🔈 Enable Ambient Sound";
      } else {
        audioCtx.resume();
        soundBtn.innerText = "🔊 Mute Sound";
      }
    }
  });

  // 6. ANIMATION LOOP
  let earthAngle = 0;
  let marsAngle = Math.PI / 4;
  let saturnAngle = Math.PI / 1.5;

  const currentTargetPos = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);

    // Planet Rotations
    earthMesh.rotation.y += 0.002;
    cloudMesh.rotation.y += 0.0026;
    marsMesh.rotation.y += 0.0018;
    saturnMesh.rotation.y += 0.003;

    // Orbital Motions
    earthAngle += 0.0015;
    earthGroup.position.x = Math.cos(earthAngle) * 12;
    earthGroup.position.z = Math.sin(earthAngle) * 12;

    marsAngle += 0.0009;
    marsGroup.position.x = Math.cos(marsAngle) * 18;
    marsGroup.position.z = Math.sin(marsAngle) * 18;

    saturnAngle += 0.0004;
    saturnGroup.position.x = Math.cos(saturnAngle) * 38;
    saturnGroup.position.z = Math.sin(saturnAngle) * 38;

    // Animate Asteroid Belt
    for (let i = 0; i < asteroidCount; i++) {
      asteroidData[i].angle += asteroidData[i].speed;
      dummy.position.set(
        Math.cos(asteroidData[i].angle) * asteroidData[i].radius,
        asteroidData[i].y,
        Math.sin(asteroidData[i].angle) * asteroidData[i].radius
      );
      dummy.rotation.x += 0.01;
      dummy.rotation.y += 0.01;
      dummy.updateMatrix();
      asteroidInstanced.setMatrixAt(i, dummy.matrix);
    }
    asteroidInstanced.instanceMatrix.needsUpdate = true;

    // Camera Tracking
    if (targetObject) {
      targetObject.getWorldPosition(currentTargetPos);
      const offset = currentTargetPos.clone().sub(controls.target);
      camera.position.add(offset);
      controls.target.copy(currentTargetPos);
    } else {
      controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.05);
    }

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
