<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA 3D Space Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    canvas { display: block; }
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 300px;
      pointer-events: none;
    }
    #info-panel h1 { margin: 0 0 5px 0; font-size: 18px; color: #4af; }
    #info-panel p { margin: 5px 0; font-size: 13px; color: #ccc; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="info-panel">
    <h1>NASA Near-Earth Asteroids</h1>
    <p id="status">Fetching real live data from NASA...</p>
    <p id="count"></p>
  </div>

<script>
  // 1. SCENE & CAMERA SETUP
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 2. LIGHTING
  const ambientLight = new THREE.AmbientLight(0x404040);
  scene.add(ambientLight);
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
  sunLight.position.set(5, 3, 5);
  scene.add(sunLight);

  // 3. STARFIELD BACKGROUND
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 3000;
  const starPositions = new Float32Array(starsCount * 3);
  for (let i = 0; i < starsCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 400;
  }
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
  const starfield = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(starfield);

  // 4. EARTH & MOON MESHES
  const textureLoader = new THREE.TextureLoader();
  const earthTexture = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(2, 64, 64),
    new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.8 })
  );
  scene.add(earth);

  const moonTexture = textureLoader.load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 32, 32),
    new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 0.9 })
  );
  scene.add(moon);

  let moonAngle = 0;
  const moonOrbitRadius = 4.5;

  // 5. FETCH LIVE NASA ASTEROID DATA (API)
  const asteroids = [];
  const statusElem = document.getElementById('status');
  const countElem = document.getElementById('count');

  // NASA's DEMO_KEY API endpoint for Near Earth Objects (NEO)
  const nasaApiUrl = 'https://api.nasa.gov/neo/rest/v1/feed?start_date=2026-08-01&end_date=2026-08-07&api_key=DEMO_KEY';

  fetch(nasaApiUrl)
    .then(response => response.json())
    .then(data => {
      const nearEarthObjects = data.near_earth_objects;
      let totalAsteroids = 0;

      // Loop through dates returned by NASA API
      Object.keys(nearEarthObjects).forEach(date => {
        nearEarthObjects[date].forEach(asteroid => {
          totalAsteroids++;

          // Create a 3D Mesh for each asteroid (small gray rock)
          const size = Math.max(0.08, Math.min(0.25, asteroid.estimated_diameter.meters.estimated_diameter_max / 500));
          const asteroidGeometry = new THREE.DodecahedronGeometry(size, 1);
          const asteroidMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
          const asteroidMesh = new THREE.Mesh(asteroidGeometry, asteroidMaterial);

          // Randomize orbit radius around Earth (between 6 and 14 units out)
          const radius = 6 + Math.random() * 8;
          const angle = Math.random() * Math.PI * 2;
          const speed = (Math.random() * 0.005) + 0.002;

          asteroidMesh.position.x = Math.cos(angle) * radius;
          asteroidMesh.position.z = Math.sin(angle) * radius;
          asteroidMesh.position.y = (Math.random() - 0.5) * 4; // Slight vertical tilt

          scene.add(asteroidMesh);

          // Save asteroid orbit parameters for animation
          asteroids.push({
            mesh: asteroidMesh,
            angle: angle,
            radius: radius,
            speed: speed
          });
        });
      });

      statusElem.innerText = 'Connected to NASA NeoWS API!';
      countElem.innerText = `Tracked Asteroids Near Earth: ${totalAsteroids}`;
    })
    .catch(error => {
      statusElem.innerText = 'Unable to load NASA data. Check connection.';
      console.error(error);
    });

  // 6. CAMERA & CONTROLS
  camera.position.z = 12;
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // 7. ANIMATION LOOP
  function animate() {
    requestAnimationFrame(animate);

    // Rotate Earth and Moon
    earth.rotation.y += 0.002;
    moon.rotation.y += 0.001; // Fixed slow rotation

    // Orbit Moon around Earth
    moonAngle += 0.008;
    moon.position.x = Math.cos(moonAngle) * moonOrbitRadius;
    moon.position.z = Math.sin(moonAngle) * moonOrbitRadius;

    // Orbit all NASA asteroids around Earth
    asteroids.forEach(ast => {
      ast.angle += ast.speed;
      ast.mesh.position.x = Math.cos(ast.angle) * ast.radius;
      ast.mesh.position.z = Math.sin(ast.angle) * ast.radius;
      ast.mesh.rotation.x += 0.01;
      ast.mesh.rotation.y += 0.01;
    });

    starfield.rotation.y -= 0.0002;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
