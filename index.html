<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realistic Solar System - Planet Follow Camera</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #333;
      pointer-events: none;
    }
    #ui h3 { margin: 0 0 5px 0; font-size: 16px; color: #64b5f6; }
    #ui p { margin: 0; font-size: 13px; color: #ccc; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui">
  <h3 id="target-name">Target: Overview</h3>
  <p>Click any planet to follow it | Click empty space to reset</p>
</div>

<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  // Orbit Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  camera.position.set(0, 20, 35);
  controls.enableDamping = true; // Smooth movements
  controls.dampingFactor = 0.05;

  // LIGHTING
  const sunLight = new THREE.PointLight(0xffffff, 2.5, 300);
  scene.add(sunLight);

  const ambientLight = new THREE.AmbientLight(0x111522, 0.4);
  scene.add(ambientLight);

  // SUN
  const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(3.5, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xfffaed })
  );
  sunMesh.name = "Sun";
  scene.add(sunMesh);

  // TEXTURE LOADER
  const textureLoader = new THREE.TextureLoader();

  // EARTH
  const earthMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');
  const earthNormal = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg');
  const earthSpecular = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg');
  const earthClouds = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_clouds_2048.png');

  const earthGeometry = new THREE.SphereGeometry(2, 64, 64);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthMap,
    normalMap: earthNormal,
    normalScale: new THREE.Vector2(0.85, 0.85),
    specularMap: earthSpecular,
    specular: new THREE.Color(0x333333),
    shininess: 25
  });
  const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
  earthMesh.name = "Earth";

  const cloudGeometry = new THREE.SphereGeometry(2.03, 64, 64);
  const cloudMaterial = new THREE.MeshStandardMaterial({
    map: earthClouds,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
  });
  const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);

  const earthGroup = new THREE.Group();
  earthGroup.add(earthMesh);
  earthGroup.add(cloudMesh);
  earthGroup.rotation.z = 23.5 * Math.PI / 180;
  scene.add(earthGroup);

  // MARS
  const marsMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/mars_1024.jpg');

  const marsGeometry = new THREE.SphereGeometry(1.2, 64, 64);
  const marsMaterial = new THREE.MeshStandardMaterial({
    map: marsMap,
    roughness: 0.8,
    metalness: 0.1
  });
  const marsMesh = new THREE.Mesh(marsGeometry, marsMaterial);
  marsMesh.name = "Mars";

  const marsGroup = new THREE.Group();
  marsGroup.add(marsMesh);
  marsGroup.rotation.z = 25.2 * Math.PI / 180;
  scene.add(marsGroup);

  // CLICK INTERACTION / RAYCASTING
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let targetObject = null;
  const targetNameUI = document.getElementById('target-name');

  // List of objects that can be targeted
  const targetables = [sunMesh, earthMesh, marsMesh];

  window.addEventListener('pointerdown', (e) => {
    // Convert click coordinates to normalized device coordinates (-1 to +1)
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(targetables);

    if (intersects.length > 0) {
      const clickedMesh = intersects[0].object;
      
      // If we clicked Earth, target the whole earthGroup (which holds clouds + mesh)
      if (clickedMesh === earthMesh) targetObject = earthGroup;
      else if (clickedMesh === marsMesh) targetObject = marsGroup;
      else targetObject = clickedMesh; // Sun

      targetNameUI.innerText = "Target: " + clickedMesh.name;
    } else {
      // Clicked space -> reset target back to center
      targetObject = null;
      targetNameUI.innerText = "Target: Overview";
    }
  });

  // ANIMATION & ORBITS
  let earthAngle = 0;
  let marsAngle = Math.PI / 3;

  const earthOrbitRadius = 14;
  const marsOrbitRadius = 22;

  const currentTargetPos = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);

    // Self-rotations
    sunMesh.rotation.y += 0.0005;
    earthMesh.rotation.y += 0.002;
    cloudMesh.rotation.y += 0.0026;
    marsMesh.rotation.y += 0.0018;

    // Orbital revolutions
    earthAngle += 0.0015;
    earthGroup.position.x = Math.cos(earthAngle) * earthOrbitRadius;
    earthGroup.position.z = Math.sin(earthAngle) * earthOrbitRadius;

    marsAngle += 0.0008;
    marsGroup.position.x = Math.cos(marsAngle) * marsOrbitRadius;
    marsGroup.position.z = Math.sin(marsAngle) * marsOrbitRadius;

    // CAMERA FOLLOWING LOGIC
    if (targetObject) {
      // Smoothly update controls target to follow the object in world space
      targetObject.getWorldPosition(currentTargetPos);
      
      // Shift camera along with the target position
      const offset = currentTargetPos.clone().sub(controls.target);
      camera.position.add(offset);
      controls.target.copy(currentTargetPos);
    } else {
      // Smoothly ease back toward central origin
      controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.05);
    }

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
