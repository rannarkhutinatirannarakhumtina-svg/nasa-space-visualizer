<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA 3D Space Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<script>
  // 1. SCENE & CAMERA SETUP
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 2. LIGHTING
  const ambientLight = new THREE.AmbientLight(0x333333);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
  sunLight.position.set(5, 3, 5);
  scene.add(sunLight);

  // 3. STARFIELD BACKGROUND
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 3000;
  const starPositions = new Float32Array(starsCount * 3);

  for (let i = 0; i < starsCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 400;
  }

  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
  const starfield = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(starfield);

  // 4. EARTH MESH
  const textureLoader = new THREE.TextureLoader();
  const earthTexture = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
  const geometry = new THREE.SphereGeometry(2, 64, 64);
  const material = new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.8 });
  const earth = new THREE.Mesh(geometry, material);
  scene.add(earth);

  // 5. MOON MESH (Smaller sphere orbiting Earth)
  const moonTexture = textureLoader.load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
  const moonGeometry = new THREE.SphereGeometry(0.5, 32, 32);
  const moonMaterial = new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 0.9 });
  const moon = new THREE.Mesh(moonGeometry, moonMaterial);
  scene.add(moon);

  // Orbital parameters for the Moon
  let moonAngle = 0;
  const moonOrbitRadius = 4.5;
  const moonOrbitSpeed = 0.01;

  // 6. CAMERA & CONTROLS
  camera.position.z = 10;
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // 7. ANIMATION LOOP
  function animate() {
    requestAnimationFrame(animate);

    // Rotate Earth
    earth.rotation.y += 0.002;

    // Rotate Moon on its own axis
    moon.rotation.y += 0.005;

    // Calculate Moon's orbital position using Sine and Cosine
    moonAngle += moonOrbitSpeed;
    moon.position.x = Math.cos(moonAngle) * moonOrbitRadius;
    moon.position.z = Math.sin(moonAngle) * moonOrbitRadius;

    // Rotate stars
    starfield.rotation.y -= 0.0002;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
