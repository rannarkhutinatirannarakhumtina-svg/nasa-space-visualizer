<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA 3D Space Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
  <!-- Load Three.js 3D library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Load OrbitControls for mouse interaction -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<script>
  // 1. Scene, Camera, and Renderer Setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 2. Lighting
  const ambientLight = new THREE.AmbientLight(0x333333);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0xffffff, 2, 300);
  pointLight.position.set(10, 10, 10);
  scene.add(pointLight);

  // 3. Central Planet Mesh
  const geometry = new THREE.SphereGeometry(2, 32, 32);
  const material = new THREE.MeshStandardMaterial({ color: 0x2288ff, wireframe: true });
  const earth = new THREE.Mesh(geometry, material);
  scene.add(earth);

  // 4. Position Camera & Mouse Controls
  camera.position.z = 8;
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // 5. Animation Loop
  function animate() {
    requestAnimationFrame(animate);
    earth.rotation.y += 0.005; // Spin planet
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
