<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA 3D Space Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    canvas { display: block; }
    
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 280px;
      pointer-events: none;
      z-index: 99;
    }
    #info-panel h1 { margin: 0 0 5px 0; font-size: 18px; color: #4af; }
    #info-panel p { margin: 5px 0; font-size: 13px; color: #ccc; }

    #click-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      background: rgba(10, 15, 30, 0.95);
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #5af;
      width: 260px;
      display: none;
      z-index: 1000;
      box-shadow: 0 0 20px rgba(80, 170, 255, 0.6);
    }
    #click-panel h2 { margin: 0 0 10px 0; font-size: 18px; color: #5af; }
    #click-panel p { margin: 8px 0; font-size: 13px; color: #eee; }
    #click-panel .hazardous { color: #ff4444; font-weight: bold; }
    #click-panel .safe { color: #4f4; font-weight: bold; }
    #close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
    }
    #close-btn:hover { color: #fff; }

    #audio-status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #888;
      font-size: 12px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #444;
      pointer-events: none;
      z-index: 99;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="info-panel">
    <h1>NASA Near-Earth Asteroids</h1>
    <p id="status">Fetching real live data from NASA...</p>
    <p id="count"></p>
    <p style="color: #888; font-style: italic; margin-top: 10px;">Click screen for audio. Drag/scroll to zoom!</p>
  </div>

  <div id="click-panel">
    <button id="close-btn" onclick="document.getElementById('click-panel').style.display='none'">&times;</button>
    <h2 id="ast-name">Asteroid Details</h2>
    <p>Max Diameter: <span id="ast-size"></span> meters</p>
    <p>Velocity: <span id="ast-vel"></span> km/h</p>
    <p>Status: <span id="ast-haz"></span></p>
  </div>

  <div id="audio-status">Audio: Click screen to start</div>

<script>
  let audioCtx = null;
  let audioStarted = false;

  function startAudioEngine() {
    if (audioStarted) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(55, audioCtx.currentTime);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(110, audioCtx.currentTime);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(220, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc1.start();
    osc2.start();

    audioStarted = true;
    document.getElementById('audio-status').innerText = 'Audio: Active 🔊';
    document.getElementById('audio-status').style.color = '#4f4';
  }

  function playHighPitchClick() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.exponentialRampToValueAtTime(3200, now + 0.07);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.07);
  }

  window.addEventListener('pointerdown', startAudioEngine);

  // DETAILED TEXTURE GENERATORS
  function generateEarthTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0f2a4a'; ctx.fillRect(0, 0, 1024, 512);
    ctx.fillStyle = '#1e5927';
    for(let i = 0; i < 80; i++) {
      ctx.beginPath();
      ctx.arc(Math.random() * 1024, Math.random() * 512, 30 + Math.random() * 90, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#4a7c38';
    for(let i = 0; i < 40; i++) {
      ctx.beginPath();
      ctx.arc(Math.random() * 1024, Math.random() * 512, 15 + Math.random() * 45, 0, Math.PI * 2);
      ctx.fill();
    }
    // Polar caps
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 1024, 30);
    ctx.fillRect(0, 482, 1024, 30);
    return new THREE.CanvasTexture(canvas);
  }

  function generateMarsTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#a63914'; ctx.fillRect(0, 0, 1024, 512);
    ctx.fillStyle = '#6e2107';
    for(let i = 0; i < 100; i++) {
      ctx.beginPath();
      ctx.arc(Math.random() * 1024, Math.random() * 512, 10 + Math.random() * 60, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#e8dec8';
    ctx.beginPath(); ctx.arc(512, 15, 25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(512, 497, 20, 0, Math.PI * 2); ctx.fill();
    return new THREE.CanvasTexture(canvas);
  }

  function generateMoonTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0, 0, 512, 256);
    ctx.fillStyle = '#4a4a4a';
    for(let i = 0; i < 60; i++) {
      ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 256, 5 + Math.random() * 20, 0, Math.PI * 2); ctx.fill();
    }
    return new THREE.CanvasTexture(canvas);
  }

  function generateSaturnTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#cbb281'; ctx.fillRect(0, 0, 1024, 512);
    for(let y = 0; y < 512; y += 8) {
      ctx.fillStyle = (y % 16 === 0) ? '#a88f5d' : '#d8c497';
      ctx.fillRect(0, y, 1024, 4 + Math.random() * 6);
    }
    return new THREE.CanvasTexture(canvas);
  }

  // THREE.JS SCENE SETUP
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  // LIGHTING SYSTEM
  const ambientLight = new THREE.AmbientLight(0x1e2025, 0.3);
  scene.add(ambientLight);

  const sunLight = new THREE.PointLight(0xffffff, 2.5, 300, 0.5);
  scene.add(sunLight);

  // SUN
  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(4.5, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0xfff5d6 })
  );
  scene.add(sun);

  function createSunGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.25, 'rgba(255, 220, 130, 0.8)');
    grad.addColorStop(0.6, 'rgba(255, 140, 40, 0.25)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(canvas);
  }

  const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: createSunGlowTexture(),
    transparent: true,
    blending: THREE.AdditiveBlending
  }));
  sunGlow.scale.set(18, 18, 1);
  sun.add(sunGlow);

  // STARFIELD
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 5000;
  const starPositions = new Float32Array(starsCount * 3);
  for (let i = 0; i < starsCount * 3; i++) starPositions[i] = (Math.random() - 0.5) * 600;
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 })));

  // ORBIT LINE HELPER
  function createOrbitLine(radius) {
    const points = [];
    for (let i = 0; i <= 128; i++) {
      const theta = (i / 128) * Math.PI * 2;
      points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 });
    return new THREE.LineLoop(geometry, material);
  }

  // 1. EARTH & MOON (ORBIT RADIUS 16 - INSIDE MARS)
  const earthOrbitRadius = 16;
  scene.add(createOrbitLine(earthOrbitRadius));

  const earthGroup = new THREE.Group();
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(2.0, 64, 64),
    new THREE.MeshStandardMaterial({ map: generateEarthTexture(), roughness: 0.6, metalness: 0.1 })
  );
  earthGroup.add(earth);

  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 32, 32),
    new THREE.MeshStandardMaterial({ map: generateMoonTexture(), roughness: 0.9 })
  );
  earthGroup.add(moon);
  let moonAngle = 0;
  const moonOrbitRadius = 3.8;

  scene.add(earthGroup);
  let earthAngle = 0;

  // 2. MARS (ORBIT RADIUS 24 - OUTSIDE EARTH)
  const marsOrbitRadius = 24;
  scene.add(createOrbitLine(marsOrbitRadius));

  const marsGroup = new THREE.Group();
  const marsMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 64, 64),
    new THREE.MeshStandardMaterial({ map: generateMarsTexture(), roughness: 0.8 })
  );
  marsGroup.add(marsMesh);
  scene.add(marsGroup);
  let marsAngle = Math.PI / 3;

  // 3. SATURN (ORBIT RADIUS 36)
  const saturnOrbitRadius = 36;
  scene.add(createOrbitLine(saturnOrbitRadius));

  const saturnGroup = new THREE.Group();
  const saturnMesh = new THREE.Mesh(
    new THREE.SphereGeometry(2.6, 64, 64),
    new THREE.MeshStandardMaterial({ map: generateSaturnTexture(), roughness: 0.7 })
  );
  saturnGroup.add(saturnMesh);

  function createRockTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#8a857b';
    ctx.beginPath();
    ctx.moveTo(32, 8); ctx.lineTo(56, 24); ctx.lineTo(48, 56); ctx.lineTo(16, 48); ctx.lineTo(8, 24);
    ctx.closePath(); ctx.fill();
    return new THREE.CanvasTexture(canvas);
  }

  const ringParticleCount = 9000;
  const ringPositions = new Float32Array(ringParticleCount * 3);
  const ringColors = new Float32Array(ringParticleCount * 3);

  for (let i = 0; i < ringParticleCount; i++) {
    let radius = 3.4 + Math.random() * 2.8;
    if (radius > 4.5 && radius < 4.8) radius += 0.3;
    const angle = Math.random() * Math.PI * 2;
    ringPositions[i * 3] = Math.cos(angle) * radius;
    ringPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.12;
    ringPositions[i * 3 + 2] = Math.sin(angle) * radius;
    ringColors[i * 3] = 0.82; ringColors[i * 3 + 1] = 0.72; ringColors[i * 3 + 2] = 0.58;
  }

  const ringGeometry = new THREE.BufferGeometry();
  ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
  ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

  const ringParticleSystem = new THREE.Points(ringGeometry, new THREE.PointsMaterial({
    size: 0.2,
    map: createRockTexture(),
    vertexColors: true,
    transparent: true,
    alphaTest: 0.2
  }));
  ringParticleSystem.rotation.x = Math.PI / 6;
  saturnGroup.add(ringParticleSystem);

  scene.add(saturnGroup);
  let saturnAngle = Math.PI * 1.4;

  // ASTEROIDS
  const clickableObjects = [];
  const asteroidsData = [];
  const statusElem = document.getElementById('status');
  const countElem = document.getElementById('count');

  function createAsteroid(name, diameterMeters, isHazardous, velocity) {
    const size = Math.max(0.12, Math.min(0.35, diameterMeters / 300));
    const asteroidGeometry = new THREE.DodecahedronGeometry(size, 1);
    const color = isHazardous ? 0xff3333 : 0x888888;
    const asteroidMesh = new THREE.Mesh(
      asteroidGeometry,
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 })
    );

    const radius = 5.0 + Math.random() * 5.5;
    const angle = Math.random() * Math.PI * 2;
    const speed = (Math.random() * 0.004) + 0.002;

    asteroidMesh.position.x = Math.cos(angle) * radius;
    asteroidMesh.position.z = Math.sin(angle) * radius;
    asteroidMesh.position.y = (Math.random() - 0.5) * 2.5;

    earthGroup.add(asteroidMesh);

    asteroidMesh.userData = { name: name, diameter: diameterMeters, isHazardous: isHazardous, velocity: velocity };
    clickableObjects.push(asteroidMesh);
    asteroidsData.push({ mesh: asteroidMesh, angle: angle, radius: radius, speed: speed });
  }

  const today = new Date().toISOString().split('T')[0];
  const nasaApiUrl = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${today}&end_date=${today}&api_key=DEMO_KEY`;

  fetch(nasaApiUrl)
    .then(response => response.json())
    .then(data => {
      const nearEarthObjects = data.near_earth_objects;
      let totalAsteroids = 0;
      Object.keys(nearEarthObjects).forEach(date => {
        nearEarthObjects[date].forEach(asteroid => {
          totalAsteroids++;
          const diameter = asteroid.estimated_diameter.meters.estimated_diameter_max;
          const isHazardous = asteroid.is_potentially_hazardous_asteroid;
          const velocity = asteroid.close_approach_data[0].relative_velocity.kilometers_per_hour;
          createAsteroid(asteroid.name, diameter, isHazardous, velocity);
        });
      });
      statusElem.innerText = 'Connected to NASA NeoWS API!';
      statusElem.style.color = '#4f4';
      countElem.innerText = `Tracked Asteroids Near Earth: ${totalAsteroids}`;
    })
    .catch(() => {
      statusElem.innerText = 'Running in Simulated Asteroid Mode';
      statusElem.style.color = '#ffaa00';
      for (let i = 0; i < 20; i++) {
        createAsteroid(`Asteroid-${i+1}`, 100 + Math.random() * 300, i % 5 === 0, 42000 + Math.random()*15000);
      }
      countElem.innerText = 'Tracked Asteroids Near Earth: 20 (Simulated)';
    });

  camera.position.set(0, 30, 45);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function checkClick(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects);

    if (intersects.length > 0) {
      playHighPitchClick();
      const asteroid = intersects[0].object;
      const data = asteroid.userData;

      document.getElementById('ast-name').innerText = data.name;
      document.getElementById('ast-size').innerText = Math.round(data.diameter);
      document.getElementById('ast-vel').innerText = Math.round(Number(data.velocity)).toLocaleString();

      const hazElem = document.getElementById('ast-haz');
      if (data.isHazardous) {
        hazElem.innerText = "Potentially Hazardous";
        hazElem.className = "hazardous";
      } else {
        hazElem.innerText = "Safe Near-Earth Object";
        hazElem.className = "safe";
      }

      document.getElementById('click-panel').style.display = 'block';
    }
  }

  window.addEventListener('mousemove', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects);
    document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
  });

  window.addEventListener('click', checkClick);

  function animate() {
    requestAnimationFrame(animate);

    sun.rotation.y += 0.001;
    earth.rotation.y += 0.003;
    moon.rotation.y += 0.001;
    marsMesh.rotation.y += 0.003;
    saturnMesh.rotation.y += 0.004;
    ringParticleSystem.rotation.z -= 0.0005;

    moonAngle += 0.008;
    moon.position.x = Math.cos(moonAngle) * moonOrbitRadius;
    moon.position.z = Math.sin(moonAngle) * moonOrbitRadius;

    earthAngle += 0.0015;
    earthGroup.position.x = Math.cos(earthAngle) * earthOrbitRadius;
    earthGroup.position.z = Math.sin(earthAngle) * earthOrbitRadius;

    marsAngle += 0.001;
    marsGroup.position.x = Math.cos(marsAngle) * marsOrbitRadius;
    marsGroup.position.z = Math.sin(marsAngle) * marsOrbitRadius;

    saturnAngle += 0.0004;
    saturnGroup.position.x = Math.cos(saturnAngle) * saturnOrbitRadius;
    saturnGroup.position.z = Math.sin(saturnAngle) * saturnOrbitRadius;

    asteroidsData.forEach(ast => {
      ast.angle += ast.speed;
      ast.mesh.position.x = Math.cos(ast.angle) * ast.radius;
      ast.mesh.position.z = Math.sin(ast.angle) * ast.radius;
      ast.mesh.rotation.x += 0.01;
      ast.mesh.rotation.y += 0.01;
    });

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
