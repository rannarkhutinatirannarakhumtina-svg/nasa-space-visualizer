<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA 3D Space Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    canvas { display: block; }
    
    /* Top Left Info Panel */
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 280px;
      pointer-events: none;
      z-index: 99;
    }
    #info-panel h1 { margin: 0 0 5px 0; font-size: 18px; color: #4af; }
    #info-panel p { margin: 5px 0; font-size: 13px; color: #ccc; }

    /* Top Right Click Panel Overlay */
    #click-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      background: rgba(10, 15, 30, 0.95);
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #5af;
      width: 260px;
      display: none; /* Controlled by JS */
      z-index: 1000;
      box-shadow: 0 0 20px rgba(80, 170, 255, 0.6);
    }
    #click-panel h2 { margin: 0 0 10px 0; font-size: 18px; color: #5af; }
    #click-panel p { margin: 8px 0; font-size: 13px; color: #eee; }
    #click-panel .hazardous { color: #ff4444; font-weight: bold; }
    #click-panel .safe { color: #4f4; font-weight: bold; }
    #close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
    }
    #close-btn:hover { color: #fff; }

    /* Audio Toggle Indicator */
    #audio-status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #888;
      font-size: 12px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #444;
      pointer-events: none;
      z-index: 99;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Top Left Panel -->
  <div id="info-panel">
    <h1>NASA Near-Earth Asteroids</h1>
    <p id="status">Fetching real live data from NASA...</p>
    <p id="count"></p>
    <p style="color: #888; font-style: italic; margin-top: 10px;">Click screen once to activate sound. Click an asteroid to inspect NASA data.</p>
  </div>

  <!-- Top Right Click Panel -->
  <div id="click-panel">
    <button id="close-btn" onclick="document.getElementById('click-panel').style.display='none'">&times;</button>
    <h2 id="ast-name">Asteroid Details</h2>
    <p>Max Diameter: <span id="ast-size"></span> meters</p>
    <p>Velocity: <span id="ast-vel"></span> km/h</p>
    <p>Status: <span id="ast-haz"></span></p>
  </div>

  <!-- Audio Status Label -->
  <div id="audio-status">Audio: Click screen to start</div>

<script>
  // -------------------------------------------------------------
  // AUDIO SYNTHESIZER ENGINE
  // -------------------------------------------------------------
  let audioCtx = null;
  let audioStarted = false;

  function startAudioEngine() {
    if (audioStarted) {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    // CONTINUOUS AMBIENT COSMIC DRONE
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    // Low cosmic frequencies (Sine + Sawtooth mix)
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(55, audioCtx.currentTime); // Low A

    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(110, audioCtx.currentTime); // Octave

    // Lowpass filter to soften the synth hum into space ambiance
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(220, audioCtx.currentTime);

    // Master Volume for Ambient Drone
    gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc1.start();
    osc2.start();

    audioStarted = true;
    document.getElementById('audio-status').innerText = 'Audio: Active 🔊';
    document.getElementById('audio-status').style.color = '#4f4';
    document.getElementById('audio-status').style.borderColor = '#4f4';
  }

  // HIGH-PITCHED AMONG US STYLE CLICK SOUND
  function playHighPitchClick() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    // Triangle wave for crisp arcade interface chirp
    osc.type = 'triangle';

    // High frequency sweep (1400Hz up to 3200Hz)
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.exponentialRampToValueAtTime(3200, now + 0.07);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.07);
  }

  // GLOBAL CLICK ACTIVATOR
  window.addEventListener('pointerdown', () => {
    startAudioEngine();
  });


  // -------------------------------------------------------------
  // 1. THREE.JS SCENE SETUP
  // -------------------------------------------------------------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 2. LIGHTING
  const ambientLight = new THREE.AmbientLight(0x404040);
  scene.add(ambientLight);
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
  sunLight.position.set(5, 3, 5);
  scene.add(sunLight);

  // 3. STARFIELD
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 3000;
  const starPositions = new Float32Array(starsCount * 3);
  for (let i = 0; i < starsCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 400;
  }
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
  const starfield = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(starfield);

  // 4. EARTH & MOON
  const textureLoader = new THREE.TextureLoader();
  const earthTexture = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(2, 64, 64),
    new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.8 })
  );
  scene.add(earth);

  const moonTexture = textureLoader.load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 32, 32),
    new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 0.9 })
  );
  scene.add(moon);

  let moonAngle = 0;
  const moonOrbitRadius = 4.5;

  // 5. ASTEROID CREATION & DATA
  const clickableObjects = [];
  const asteroidsData = [];
  const statusElem = document.getElementById('status');
  const countElem = document.getElementById('count');

  function createAsteroid(name, diameterMeters, isHazardous, velocity) {
    const size = Math.max(0.12, Math.min(0.35, diameterMeters / 300));
    const asteroidGeometry = new THREE.DodecahedronGeometry(size, 1);
    const color = isHazardous ? 0xff4444 : 0x888888;
    const asteroidMaterial = new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 });
    const asteroidMesh = new THREE.Mesh(asteroidGeometry, asteroidMaterial);

    const radius = 5.5 + Math.random() * 8;
    const angle = Math.random() * Math.PI * 2;
    const speed = (Math.random() * 0.004) + 0.002;

    asteroidMesh.position.x = Math.cos(angle) * radius;
    asteroidMesh.position.z = Math.sin(angle) * radius;
    asteroidMesh.position.y = (Math.random() - 0.5) * 4;

    scene.add(asteroidMesh);

    asteroidMesh.userData = {
      name: name,
      diameter: diameterMeters,
      isHazardous: isHazardous,
      velocity: velocity
    };
    
    clickableObjects.push(asteroidMesh);

    asteroidsData.push({
      mesh: asteroidMesh,
      angle: angle,
      radius: radius,
      speed: speed
    });
  }

  // Fetch NASA API Data
  const today = new Date().toISOString().split('T')[0];
  const nasaApiUrl = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${today}&end_date=${today}&api_key=DEMO_KEY`;

  fetch(nasaApiUrl)
    .then(response => response.json())
    .then(data => {
      const nearEarthObjects = data.near_earth_objects;
      let totalAsteroids = 0;

      Object.keys(nearEarthObjects).forEach(date => {
        nearEarthObjects[date].forEach(asteroid => {
          totalAsteroids++;
          const diameter = asteroid.estimated_diameter.meters.estimated_diameter_max;
          const isHazardous = asteroid.is_potentially_hazardous_asteroid;
          const velocity = asteroid.close_approach_data[0].relative_velocity.kilometers_per_hour;
          createAsteroid(asteroid.name, diameter, isHazardous, velocity);
        });
      });

      statusElem.innerText = 'Connected to NASA NeoWS API!';
      statusElem.style.color = '#4f4';
      countElem.innerText = `Tracked Asteroids Near Earth: ${totalAsteroids}`;
    })
    .catch(() => {
      statusElem.innerText = 'Running in Simulated Asteroid Mode';
      statusElem.style.color = '#ffaa00';
      for (let i = 0; i < 20; i++) {
        createAsteroid(`Asteroid-${i+1}`, 100 + Math.random() * 300, i % 5 === 0, 42000 + Math.random()*15000);
      }
      countElem.innerText = 'Tracked Asteroids Near Earth: 20 (Simulated)';
    });

  // 6. CAMERA & CONTROLS
  camera.position.z = 12;
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // 7. RAYCASTING & CLICK LOGIC
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function checkClick(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects);

    if (intersects.length > 0) {
      // Trigger high pitched UI sound
      playHighPitchClick();

      const asteroid = intersects[0].object;
      const data = asteroid.userData;

      // Update Panel Content
      document.getElementById('ast-name').innerText = data.name;
      document.getElementById('ast-size').innerText = Math.round(data.diameter);
      document.getElementById('ast-vel').innerText = Math.round(Number(data.velocity)).toLocaleString();

      const hazElem = document.getElementById('ast-haz');
      if (data.isHazardous) {
        hazElem.innerText = "Potentially Hazardous";
        hazElem.className = "hazardous";
      } else {
        hazElem.innerText = "Safe Near-Earth Object";
        hazElem.className = "safe";
      }

      // Show panel
      const panel = document.getElementById('click-panel');
      panel.style.display = 'block';
    }
  }

  // Hover effect to update cursor
  window.addEventListener('mousemove', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects);
    document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
  });

  window.addEventListener('click', checkClick);

  // 8. ANIMATION LOOP
  function animate() {
    requestAnimationFrame(animate);

    earth.rotation.y += 0.002;
    moon.rotation.y += 0.0001;

    moonAngle += 0.008;
    moon.position.x = Math.cos(moonAngle) * moonOrbitRadius;
    moon.position.z = Math.sin(moonAngle) * moonOrbitRadius;

    asteroidsData.forEach(ast => {
      ast.angle += ast.speed;
      ast.mesh.position.x = Math.cos(ast.angle) * ast.radius;
      ast.mesh.position.z = Math.sin(ast.angle) * ast.radius;
      ast.mesh.rotation.x += 0.01;
      ast.mesh.rotation.y += 0.01;
    });

    starfield.rotation.y -= 0.0002;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
