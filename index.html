<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realistic Earth & Mars - Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  // Orbit Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  camera.position.set(0, 15, 30);
  controls.update();

  // LIGHTING
  // 1. PointLight at the Sun's origin (0,0,0)
  const sunLight = new THREE.PointLight(0xffffff, 2.5, 300);
  scene.add(sunLight);

  // 2. Soft space ambient light so night sides aren't pitch black
  const ambientLight = new THREE.AmbientLight(0x111522, 0.4);
  scene.add(ambientLight);

  // SUN
  const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(3.5, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xfffaed })
  );
  scene.add(sunMesh);

  // TEXTURE LOADER
  const textureLoader = new THREE.TextureLoader();

  // -------------------------------------------------------------
  // EARTH SETUP
  // -------------------------------------------------------------
  const earthMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');
  const earthNormal = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg');
  const earthSpecular = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg');
  const earthClouds = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_clouds_2048.png');

  const earthGeometry = new THREE.SphereGeometry(2, 64, 64);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthMap,
    normalMap: earthNormal,
    normalScale: new THREE.Vector2(0.85, 0.85),
    specularMap: earthSpecular,
    specular: new THREE.Color(0x333333),
    shininess: 25
  });
  const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);

  // Earth Clouds Layer
  const cloudGeometry = new THREE.SphereGeometry(2.03, 64, 64);
  const cloudMaterial = new THREE.MeshStandardMaterial({
    map: earthClouds,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
  });
  const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);

  const earthGroup = new THREE.Group();
  earthGroup.add(earthMesh);
  earthGroup.add(cloudMesh);
  earthGroup.rotation.z = 23.5 * Math.PI / 180; // 23.5° axial tilt
  scene.add(earthGroup);

  // -------------------------------------------------------------
  // MARS SETUP
  // -------------------------------------------------------------
  // NASA High-Res Mars surface color & terrain bump maps
  const marsMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/mars_1024.jpg');

  const marsGeometry = new THREE.SphereGeometry(1.2, 64, 64);
  const marsMaterial = new THREE.MeshStandardMaterial({
    map: marsMap,
    roughness: 0.8, // Dusty, unpolished surface
    metalness: 0.1
  });
  const marsMesh = new THREE.Mesh(marsGeometry, marsMaterial);

  const marsGroup = new THREE.Group();
  marsGroup.add(marsMesh);
  marsGroup.rotation.z = 25.2 * Math.PI / 180; // 25.2° axial tilt
  scene.add(marsGroup);

  // ORBIT ANIMATION STATE
  let earthAngle = 0;
  let marsAngle = Math.PI / 3;

  const earthOrbitRadius = 14;
  const marsOrbitRadius = 22; // Mars correctly placed outside Earth

  function animate() {
    requestAnimationFrame(animate);

    // Self-rotations
    sunMesh.rotation.y += 0.0005;
    earthMesh.rotation.y += 0.002;
    cloudMesh.rotation.y += 0.0026; // Clouds drift relative to surface
    marsMesh.rotation.y += 0.0018;

    // Orbital revolutions around the Sun
    earthAngle += 0.0015;
    earthGroup.position.x = Math.cos(earthAngle) * earthOrbitRadius;
    earthGroup.position.z = Math.sin(earthAngle) * earthOrbitRadius;

    marsAngle += 0.0008; // Mars orbits slower than Earth
    marsGroup.position.x = Math.cos(marsAngle) * marsOrbitRadius;
    marsGroup.position.z = Math.sin(marsAngle) * marsOrbitRadius;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
