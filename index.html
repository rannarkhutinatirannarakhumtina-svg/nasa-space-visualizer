<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA 3D Space Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    canvas { display: block; }
    
    /* Top Left Info Panel */
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 280px;
      pointer-events: none;
      z-index: 99;
    }
    #info-panel h1 { margin: 0 0 5px 0; font-size: 18px; color: #4af; }
    #info-panel p { margin: 5px 0; font-size: 13px; color: #ccc; }

    /* Top Right Click Panel Overlay */
    #click-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      background: rgba(10, 15, 30, 0.95);
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #5af;
      width: 260px;
      display: none;
      z-index: 1000;
      box-shadow: 0 0 20px rgba(80, 170, 255, 0.6);
    }
    #click-panel h2 { margin: 0 0 10px 0; font-size: 18px; color: #5af; }
    #click-panel p { margin: 8px 0; font-size: 13px; color: #eee; }
    #click-panel .hazardous { color: #ff4444; font-weight: bold; }
    #click-panel .safe { color: #4f4; font-weight: bold; }
    #close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
    }
    #close-btn:hover { color: #fff; }

    /* Audio Toggle Indicator */
    #audio-status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #888;
      font-size: 12px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #444;
      pointer-events: none;
      z-index: 99;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Top Left Panel -->
  <div id="info-panel">
    <h1>NASA Near-Earth Asteroids</h1>
    <p id="status">Fetching real live data from NASA...</p>
    <p id="count"></p>
    <p style="color: #888; font-style: italic; margin-top: 10px;">Click screen for sound. Zoom into Saturn to see textured space rocks!</p>
  </div>

  <!-- Top Right Click Panel -->
  <div id="click-panel">
    <button id="close-btn" onclick="document.getElementById('click-panel').style.display='none'">&times;</button>
    <h2 id="ast-name">Asteroid Details</h2>
    <p>Max Diameter: <span id="ast-size"></span> meters</p>
    <p>Velocity: <span id="ast-vel"></span> km/h</p>
    <p>Status: <span id="ast-haz"></span></p>
  </div>

  <!-- Audio Status Label -->
  <div id="audio-status">Audio: Click screen to start</div>

<script>
  // -------------------------------------------------------------
  // AUDIO SYNTHESIZER ENGINE
  // -------------------------------------------------------------
  let audioCtx = null;
  let audioStarted = false;

  function startAudioEngine() {
    if (audioStarted) {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(55, audioCtx.currentTime);

    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(110, audioCtx.currentTime);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(220, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc1.start();
    osc2.start();

    audioStarted = true;
    document.getElementById('audio-status').innerText = 'Audio: Active 🔊';
    document.getElementById('audio-status').style.color = '#4f4';
    document.getElementById('audio-status').style.borderColor = '#4f4';
  }

  function playHighPitchClick() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.exponentialRampToValueAtTime(3200, now + 0.07);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.07);
  }

  window.addEventListener('pointerdown', () => {
    startAudioEngine();
  });

  // -------------------------------------------------------------
  // 1. THREE.JS SCENE SETUP
  // -------------------------------------------------------------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 2. UNCONDITIONAL FULL SCENE LIGHTING
  const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
  scene.add(ambientLight);

  // 3. WHITE SUN & GLOWING CORONA
  const sunGeometry = new THREE.SphereGeometry(4.5, 32, 32);
  const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff }); // Unaffected by shadows
  const sun = new THREE.Mesh(sunGeometry, sunMaterial);
  sun.position.set(0, 0, 0);
  scene.add(sun);

  function createSunGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.3, 'rgba(255, 240, 200, 0.6)');
    grad.addColorStop(0.7, 'rgba(255, 200, 120, 0.2)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);

    return new THREE.CanvasTexture(canvas);
  }

  const glowMaterial = new THREE.SpriteMaterial({
    map: createSunGlowTexture(),
    transparent: true,
    blending: THREE.AdditiveBlending
  });
  const sunGlow = new THREE.Sprite(glowMaterial);
  sunGlow.scale.set(16, 16, 1);
  sun.add(sunGlow);

  // 4. STARFIELD
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 4000;
  const starPositions = new Float32Array(starsCount * 3);
  for (let i = 0; i < starsCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 500;
  }
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
  const starfield = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(starfield);

  // 5. UNLIT PLANET MATERIALS (MeshBasicMaterial prevents dark shadows)
  const textureLoader = new THREE.TextureLoader();

  // EARTH & MOON GROUP
  const earthGroup = new THREE.Group();
  const earthTexture = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(2, 64, 64),
    new THREE.MeshBasicMaterial({ map: earthTexture, color: 0x2277ff })
  );
  earthGroup.add(earth);

  // MOON
  const moonTexture = textureLoader.load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 32, 32),
    new THREE.MeshBasicMaterial({ map: moonTexture, color: 0xcccccc })
  );
  earthGroup.add(moon);
  let moonAngle = 0;
  const moonOrbitRadius = 4.5;

  scene.add(earthGroup);
  let earthAngle = 0;
  const earthOrbitRadius = 16;

  // MARS
  const marsTexture = textureLoader.load('https://threejs.org/examples/textures/planets/mars_1024.jpg');
  const mars = new THREE.Mesh(
    new THREE.SphereGeometry(1.3, 32, 32),
    new THREE.MeshBasicMaterial({ map: marsTexture, color: 0xc1440e })
  );
  scene.add(mars);
  let marsAngle = Math.PI / 3;
  const marsOrbitRadius = 26;

  // ROCK TEXTURE FOR SATURN RINGS
  function createRockTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#8a857b';
    ctx.beginPath();
    ctx.moveTo(32 + Math.random()*8, 8);
    ctx.lineTo(56, 24 + Math.random()*8);
    ctx.lineTo(48 + Math.random()*8, 56);
    ctx.lineTo(16, 48 + Math.random()*8);
    ctx.lineTo(8 + Math.random()*8, 24);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#4a463d';
    ctx.beginPath();
    ctx.arc(28, 28, 8, 0, Math.PI * 2);
    ctx.arc(42, 40, 5, 0, Math.PI * 2);
    ctx.fill();

    return new THREE.CanvasTexture(canvas);
  }

  // SATURN
  const saturnTexture = textureLoader.load('https://threejs.org/examples/textures/planets/saturn_1024.jpg');
  const saturnGroup = new THREE.Group();
  
  const saturnMesh = new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 32, 32),
    new THREE.MeshBasicMaterial({ map: saturnTexture, color: 0xe2bf7d })
  );
  saturnGroup.add(saturnMesh);

  // Saturn Rings
  const ringParticleCount = 8000;
  const ringPositions = new Float32Array(ringParticleCount * 3);
  const ringColors = new Float32Array(ringParticleCount * 3);

  for (let i = 0; i < ringParticleCount; i++) {
    let radius = 3.2 + Math.random() * 2.5;
    if (radius > 4.2 && radius < 4.5) {
      radius += 0.3;
    }

    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const y = (Math.random() - 0.5) * 0.15;

    ringPositions[i * 3] = x;
    ringPositions[i * 3 + 1] = y;
    ringPositions[i * 3 + 2] = z;

    const colorType = Math.random();
    if (colorType > 0.6) {
      ringColors[i * 3] = 0.85; ringColors[i * 3 + 1] = 0.80; ringColors[i * 3 + 2] = 0.70; 
    } else if (colorType > 0.3) {
      ringColors[i * 3] = 0.65; ringColors[i * 3 + 1] = 0.58; ringColors[i * 3 + 2] = 0.48; 
    } else {
      ringColors[i * 3] = 0.45; ringColors[i * 3 + 1] = 0.45; ringColors[i * 3 + 2] = 0.45; 
    }
  }

  const ringGeometry = new THREE.BufferGeometry();
  ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
  ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

  const ringMaterial = new THREE.PointsMaterial({
    size: 0.22,
    map: createRockTexture(),
    vertexColors: true,
    transparent: true,
    alphaTest: 0.2,
    opacity: 0.9
  });

  const ringParticleSystem = new THREE.Points(ringGeometry, ringMaterial);
  ringParticleSystem.rotation.x = Math.PI / 7;
  saturnGroup.add(ringParticleSystem);

  scene.add(saturnGroup);
  let saturnAngle = Math.PI * 1.2;
  const saturnOrbitRadius = 42;

  // 6. ASTEROID CREATION & DATA
  const clickableObjects = [];
  const asteroidsData = [];
  const statusElem = document.getElementById('status');
  const countElem = document.getElementById('count');

  function createAsteroid(name, diameterMeters, isHazardous, velocity) {
    const size = Math.max(0.12, Math.min(0.35, diameterMeters / 300));
    const asteroidGeometry = new THREE.DodecahedronGeometry(size, 1);
    const color = isHazardous ? 0xff4444 : 0xaaaaaa;
    const asteroidMaterial = new THREE.MeshBasicMaterial({ color: color });
    const asteroidMesh = new THREE.Mesh(asteroidGeometry, asteroidMaterial);

    const radius = 5.5 + Math.random() * 6;
    const angle = Math.random() * Math.PI * 2;
    const speed = (Math.random() * 0.004) + 0.002;

    asteroidMesh.position.x = Math.cos(angle) * radius;
    asteroidMesh.position.z = Math.sin(angle) * radius;
    asteroidMesh.position.y = (Math.random() - 0.5) * 3;

    earthGroup.add(asteroidMesh);

    asteroidMesh.userData = {
      name: name,
      diameter: diameterMeters,
      isHazardous: isHazardous,
      velocity: velocity
    };
    
    clickableObjects.push(asteroidMesh);

    asteroidsData.push({
      mesh: asteroidMesh,
      angle: angle,
      radius: radius,
      speed: speed
    });
  }

  // Fetch NASA API Data
  const today = new Date().toISOString().split('T')[0];
  const nasaApiUrl = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${today}&end_date=${today}&api_key=DEMO_KEY`;

  fetch(nasaApiUrl)
    .then(response => response.json())
    .then(data => {
      const nearEarthObjects = data.near_earth_objects;
      let totalAsteroids = 0;

      Object.keys(nearEarthObjects).forEach(date => {
        nearEarthObjects[date].forEach(asteroid => {
          totalAsteroids++;
          const diameter = asteroid.estimated_diameter.meters.estimated_diameter_max;
          const isHazardous = asteroid.is_potentially_hazardous_asteroid;
          const velocity = asteroid.close_approach_data[0].relative_velocity.kilometers_per_hour;
          createAsteroid(asteroid.name, diameter, isHazardous, velocity);
        });
      });

      statusElem.innerText = 'Connected to NASA NeoWS API!';
      statusElem.style.color = '#4f4';
      countElem.innerText = `Tracked Asteroids Near Earth: ${totalAsteroids}`;
    })
    .catch(() => {
      statusElem.innerText = 'Running in Simulated Asteroid Mode';
      statusElem.style.color = '#ffaa00';
      for (let i = 0; i < 20; i++) {
        createAsteroid(`Asteroid-${i+1}`, 100 + Math.random() * 300, i % 5 === 0, 42000 + Math.random()*15000);
      }
      countElem.innerText = 'Tracked Asteroids Near Earth: 20 (Simulated)';
    });

  // 7. CAMERA & CONTROLS
  camera.position.set(0, 20, 35);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // 8. RAYCASTING & CLICK LOGIC
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function checkClick(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects);

    if (intersects.length > 0) {
      playHighPitchClick();

      const asteroid = intersects[0].object;
      const data = asteroid.userData;

      document.getElementById('ast-name').innerText = data.name;
      document.getElementById('ast-size').innerText = Math.round(data.diameter);
      document.getElementById('ast-vel').innerText = Math.round(Number(data.velocity)).toLocaleString();

      const hazElem = document.getElementById('ast-haz');
      if (data.isHazardous) {
        hazElem.innerText = "Potentially Hazardous";
        hazElem.className = "hazardous";
      } else {
        hazElem.innerText = "Safe Near-Earth Object";
        hazElem.className = "safe";
      }

      const panel = document.getElementById('click-panel');
      panel.style.display = 'block';
    }
  }

  window.addEventListener('mousemove', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects);
    document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
  });

  window.addEventListener('click', checkClick);

  // 9. ANIMATION LOOP
  function animate() {
    requestAnimationFrame(animate);

    // Planet Self-Rotations
    sun.rotation.y += 0.001;
    earth.rotation.y += 0.003;
    moon.rotation.y += 0.001;
    mars.rotation.y += 0.0025;
    saturnMesh.rotation.y += 0.004;

    // Saturn Ring Rotation
    ringParticleSystem.rotation.z -= 0.0005;

    // Moon Orbiting Earth
    moonAngle += 0.008;
    moon.position.x = Math.cos(moonAngle) * moonOrbitRadius;
    moon.position.z = Math.sin(moonAngle) * moonOrbitRadius;

    // Earth Orbiting Sun
    earthAngle += 0.0015;
    earthGroup.position.x = Math.cos(earthAngle) * earthOrbitRadius;
    earthGroup.position.z = Math.sin(earthAngle) * earthOrbitRadius;

    // Mars Orbiting Sun
    marsAngle += 0.001;
    mars.position.x = Math.cos(marsAngle) * marsOrbitRadius;
    mars.position.z = Math.sin(marsAngle) * marsOrbitRadius;

    // Saturn Orbiting Sun
    saturnAngle += 0.0004;
    saturnGroup.position.x = Math.cos(saturnAngle) * saturnOrbitRadius;
    saturnGroup.position.z = Math.sin(saturnAngle) * saturnOrbitRadius;

    // Near-Earth Asteroid Local Orbits
    asteroidsData.forEach(ast => {
      ast.angle += ast.speed;
      ast.mesh.position.x = Math.cos(ast.angle) * ast.radius;
      ast.mesh.position.z = Math.sin(ast.angle) * ast.radius;
      ast.mesh.rotation.x += 0.01;
      ast.mesh.rotation.y += 0.01;
    });

    starfield.rotation.y -= 0.0001;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
